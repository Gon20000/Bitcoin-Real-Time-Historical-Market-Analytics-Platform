x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: btc-analytics/airflow:2.8.1-python3.11
  env_file:
    - .env
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - AIRFLOW__CORE__FERNET_KEY=${FERNET_KEY}
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark-master:7077
    - DBT_PROFILES_DIR=/opt/airflow/dbt-transformations
    - PYSPARK_PYTHON=python3.11
    - PYSPARK_DRIVER_PYTHON=python3.11
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./dbt-transformations:/opt/airflow/dbt-transformations
    - ./spark-jobs:/opt/airflow/spark-jobs
    - ./data:/opt/spark/data
    - ./data/checkpoints:/opt/spark/checkpoints
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - btc-analytics-net

x-spark-common: &spark-common
  image: apache/spark:3.5.0
  env_file:
    - .env
  volumes:
    - ./spark-jobs:/opt/spark/jobs
    - ./data:/opt/spark/data
  networks:
    - btc-analytics-net

services:
  # ---------------------------------------------------------------------------
  # 1. SPEED LAYER (Kafka KRaft Broker & Binance WS Producer)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: btc-kafka-broker
    profiles: ["streaming", "full-stack"]
    ports:
      - "9092:9092"
    environment:
      # KRaft Mode Configuration (No ZooKeeper)
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # Cluster ID (Must be base64-encoded, exactly 22 chars for official image KRaft formatting)
      - CLUSTER_ID=${KAFKA_CLUSTER_ID:-yv_HDxg2TReKZNvB_cDI7A}
      # Listeners (Internal Docker network on 29092, Host machine on 9092)
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Topic & Retention Specifications (3 Partitions, 24-Hour Retention)
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_LOG_RETENTION_HOURS=24
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      # Official ASF image uses /var/lib/kafka/data instead of /bitnami/kafka
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - btc-analytics-net

  kafka-producer:
    build:
      context: ./kafka-streaming
      dockerfile: Dockerfile
    container_name: btc-ws-producer
    profiles: ["streaming", "full-stack"]
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-prod.binance.btc_usdt_1s.v1}
      - BINANCE_WS_URL=wss://fstream.binance.com/ws/btcusdt@kline_1s
    volumes:
      - ./kafka-streaming/producer:/app/producer
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - btc-analytics-net

  # ---------------------------------------------------------------------------
  # 2. COMPUTE LAYER (PySpark 3.5 Cluster, Structured Streaming & Batch)
  # ---------------------------------------------------------------------------
  spark-master:
    <<: *spark-common
    container_name: btc-spark-master
    profiles: ["streaming", "batch", "orchestration", "full-stack"]
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8081:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master RPC Port
    healthcheck:
      test: ["CMD-SHELL", "grep -qi ':1F90' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker:
    <<: *spark-common
    container_name: btc-spark-worker
    profiles: ["streaming", "batch", "orchestration", "full-stack"]
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-4G}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
    depends_on:
      spark-master:
        condition: service_healthy

  spark-streaming-job:
    <<: *spark-common
    container_name: btc-spark-streaming
    profiles: ["streaming", "full-stack"]
    user: root
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,io.delta:delta-spark_2.12:3.1.0
      --conf "spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension"
      --conf "spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog"
      --conf "spark.sql.session.timeZone=UTC"
      /opt/spark/jobs/stream_bronze_to_silver.py
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    restart: on-failure

  spark-batch-job:
    <<: *spark-common
    container_name: btc-spark-batch-manual
    profiles: ["batch"]  # On-demand CLI profile; scheduled runs are triggered by Airflow
    user: root
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages io.delta:delta-spark_2.12:3.1.0
      --conf "spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension"
      --conf "spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog"
      --conf "spark.sql.session.timeZone=UTC"
      /opt/spark/jobs/batch_historical_ingest.py
    depends_on:
      spark-master:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. ORCHESTRATION LAYER (Postgres 13 + Airflow 2.8.1 + Astronomer Cosmos)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:13
    container_name: btc-airflow-postgres
    profiles: ["orchestration", "full-stack"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - btc-analytics-net

  airflow-init:
    <<: *airflow-common
    container_name: btc-airflow-init
    profiles: ["orchestration", "full-stack"]
    command: version
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${FERNET_KEY}
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}

  airflow-webserver:
    <<: *airflow-common
    container_name: btc-airflow-webserver
    profiles: ["orchestration", "full-stack"]
    command: webserver
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: btc-airflow-scheduler
    profiles: ["orchestration", "full-stack"]
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. QUERY & SEMANTIC LAYER (Trino + dbt Core / MetricFlow Workspace)
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:440
    container_name: btc-trino-engine
    profiles: ["analytics", "orchestration", "full-stack"]
    ports:
      - "8082:8080"  # Mapped to 8082 on host to avoid conflict with Airflow (8085) and Spark (8081)
    volumes:
      - ./data:/opt/spark/data
      - ./trino/etc/catalog:/etc/trino/catalog
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - btc-analytics-net

  dbt-workspace:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: btc-analytics/airflow:2.8.1-python3.11
    container_name: btc-dbt-workspace
    profiles: ["analytics", "full-stack"]
    working_dir: /opt/airflow/dbt-transformations
    env_file:
      - .env
    environment:
      - DBT_PROFILES_DIR=/opt/airflow/dbt-transformations
      - TRINO_HOST=trino
      - TRINO_PORT=8080
    volumes:
      - ./dbt-transformations:/opt/airflow/dbt-transformations
      - ./data:/opt/spark/data
    depends_on:
      trino:
        condition: service_healthy
    command: bash -c "tail -f /dev/null"
    networks:
      - btc-analytics-net

networks:
  btc-analytics-net:
    driver: bridge

volumes:
  kafka_data:
  postgres_data:
