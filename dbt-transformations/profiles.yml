btc_market_analytics:
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      user: admin
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | as_number }}"
      database: delta
      schema: gold
      threads: 4
      http_scheme: http
      session_properties:
        query_max_run_time: "30m"
